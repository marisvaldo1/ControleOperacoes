<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Moedas para abrir CALL e PUT</title>
<style>
:root{--bg:#141c2b;--card:#0c1426;--tile:#111b30;--line:#243050;--fg:#e8edf7;--mut:#8d99b3;--call:#f59e0b;--put:#3b82f6;--w:380px}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:17px;margin:2px 0}
.sm,.s{font-size:11px;color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.seg{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;flex:1;min-width:230px}
.seg button,.ctl{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:12.5px;font-weight:600;padding:3px 10px;cursor:pointer}
.seg button[aria-pressed=true]{background:#0b5cad;border-color:#0b5cad;color:#fff}
button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.strip{width:min(var(--w),100%);font-size:12px;color:var(--mut);margin:4px 0 8px}
.strip b{color:var(--fg)}
.list{display:flex;flex-direction:column;gap:8px;width:min(var(--w),100%)}
.cc{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:12px;padding:8px;font-size:11.5px}
.chd{display:flex;align-items:center;gap:6px;margin-bottom:6px}.grow{flex:1}
.coin{font-weight:800;font-size:14px}
.mode{font-size:10px;font-weight:800;color:#0a0f1c;background:var(--ac);border-radius:5px;padding:1px 6px}
.vp{font-size:11px;font-weight:700;border:1px solid var(--kc);color:var(--kc);border-radius:10px;padding:1px 8px;white-space:nowrap}
.k-ok{--kc:#22c55e}.k-warn{--kc:#f59e0b}.k-bad{--kc:#ef4444}.k-info{--kc:#60a5fa}
.t-ok{color:#22c55e}.t-warn{color:#f59e0b}.t-bad{color:#ef4444}.t-info{color:#60a5fa}
.l{font-size:10px;color:var(--mut)}
.sum{display:grid;grid-template-columns:1fr auto 14px;gap:8px;align-items:center;width:100%;min-height:52px;text-align:left;background:var(--tile);border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:8px;color:var(--fg);font:inherit;padding:6px 8px;cursor:pointer}
.sum .big{display:block;font-size:17px;line-height:1.15}
.sum .l,.sum .s{display:block}
.sr div{display:flex;justify-content:space-between;gap:8px;font-size:11.5px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}
.tg[hidden]{display:none}
.tl{background:var(--tile);border-radius:8px;padding:5px 7px}
.tl b{display:block;font-size:14px;line-height:1.2}
.tl .l,.tl .s{display:block}
@media (max-width:420px){.cc{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
<h1>Moedas para abrir CALL e PUT</h1>
<div class="sm">Valores em US$. Dados de exemplo. Toque em um card para abrir os detalhes.</div>
<div class="bar"><div class="seg" id="wd" style="--n:3"></div><button class="ctl" id="all"></button></div>
<div class="strip" id="strip"></div>
<div class="list" id="out"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>{const d=Math.abs(n)<1?4:2;return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})};
const fc=n=>n>=1000?n.toLocaleString('en-US',{maximumFractionDigits:0}):fmt(n);
const sg=n=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n));
const pct=(n,d=1)=>n.toFixed(d)+'%';
const spc=(n,d=1)=>(n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(d)+'%';
const EMJ={ok:'😄',warn:'😐',bad:'😟'},RANK={ok:0,info:0,warn:1,bad:2};
const TR={alta:'Alta',lateral:'Lateral',baixa:'Baixa'},CC={ETH:'#818cf8',BNB:'#f3ba2f',BTC:'#f7931a',SOL:'#14c4a0'};
const LIST=[
{m:'CALL',coin:'ETH',pm:2274.48,cot:2546,sup:2400,res:2700,tr:'lateral',qty:2},
{m:'PUT',coin:'BNB',pm:801.2,cot:764,sup:740,res:800,tr:'lateral',usdt:1000,qty:3},
{m:'CALL',coin:'BTC',pm:90000,cot:82650,sup:81000,res:86000,tr:'baixa',qty:.1},
{m:'PUT',coin:'SOL',pm:145,cot:148.2,sup:140,res:156,tr:'lateral',usdt:500,qty:4}];
let W=380;const OPEN=new Set();

function calc(d){
const m=d.m,pm=+d.pm||0,cot=+d.cot||0,sup=+d.sup||0,res=+d.res||0,tr=d.tr,qty=+d.qty||0,usdt=+d.usdt||0;
const o={m,d,pm,cot,sup,res,tr,conds:[],extras:[]},C=o.conds;
o.ratio=pm>0?pm/cot*100:null;
if(m==='CALL'){
o.diff=cot-pm;o.edge=Math.max(pm,cot);o.edgeDist=(o.edge/cot-1)*100;o.lo=o.edge;o.hi=res>o.edge?res:o.edge;
C.push(pm<=cot?['PM x cotação','ok']:['PM x cotação',o.edgeDist<=5?'warn':'bad']);
C.push(!res?['Resistência','info']:o.edge>=res?['Resistência','ok']:['Resistência','info']);
if(!sup)C.push(['Suporte','info']);else{const x=(cot-sup)/cot*100;C.push(['Suporte',x<1?'bad':x<3?'warn':'ok'])}
C.push(['Tendência',tr==='lateral'?'ok':tr==='alta'?'info':'warn']);
if(qty>0)o.extras.push({l:'Resultado latente',v:sg(o.diff*qty),s:fmt(qty)+' moedas'});
}else{
const has=pm>0;
o.diff=has?pm-cot:null;o.edge=has?Math.min(pm,cot):cot;o.edgeDist=(1-o.edge/cot)*100;o.hi=o.edge;o.lo=sup>0&&sup<o.edge?sup:o.edge;
C.push(!has?['PM x cotação','info']:pm>=cot?['PM x cotação','ok']:['PM x cotação',o.edgeDist<=5?'warn':'bad']);
C.push(!sup?['Suporte','info']:o.edge<=sup?['Suporte','ok']:['Suporte','info']);
if(!res)C.push(['Resistência','info']);else{const x=(res-cot)/cot*100;C.push(['Resistência',x<=0?'info':x<1.5?'warn':'ok'])}
C.push(['Tendência',tr==='lateral'?'ok':tr==='baixa'?'warn':'info']);
if(usdt>0){const b=usdt/o.edge,nq=qty+b,npm=(qty*pm+usdt)/nq,ch=pm>0&&qty>0?(npm/pm-1)*100:null;o.extras.push({l:'PM projetado',v:fmt(npm),s:ch==null?'se exercer':Math.abs(ch)<.05?'PM não muda':spc(ch)+' se exercer'})}
}
const w=Math.max(0,...C.filter(c=>c[1]!=='info').map(c=>RANK[c[1]]));
o.v=['ok','warn','bad'][w];o.vt={ok:'Favorável',warn:'Atenção',bad:'Desfavorável'}[o.v];
return o}

function mt(o){
const isC=o.m==='CALL',K=n=>o.conds.find(c=>c[0]===n)[1];
const dS=o.sup>0?`${pct(Math.abs(o.cot-o.sup)/o.cot*100)} ${o.sup<=o.cot?'abaixo':'acima'}`:'',dR=o.res>0?`${pct(Math.abs(o.res/o.cot-1)*100)} ${o.res>=o.cot?'acima':'abaixo'}`:'';
const rng=isC?(o.lo===o.hi?`≥ ${fc(o.lo)}`:`${fc(o.lo)} – ${fc(o.hi)}`):(o.lo===o.hi?`≤ ${fc(o.hi)}`:`${fc(o.lo)} – ${fc(o.hi)}`);
return{
cot:['Cotação',fmt(o.cot),'',''],
pm:['Preço médio',o.pm>0?fmt(o.pm):'—','',''],
dif:[isC?'Cot − PM':'PM − Cot',o.diff==null?'—':sg(o.diff),isC?'+ = cotação acima':'+ = cotação abaixo',K('PM x cotação')],
rat:['PM ÷ Cot',o.ratio==null?'—':pct(o.ratio),isC?'< 100% = folga':'> 100% = folga',K('PM x cotação')],
edge:[isC?'Strike mín.':'Strike máx.',fmt(o.edge)],
rng,
sup:['Suporte',o.sup?fmt(o.sup):'—',dS,K('Suporte')],
res:['Resistência',o.res?fmt(o.res):'—',dR,K('Resistência')],
tr:['Tendência',TR[o.tr],'',K('Tendência')],
ex:o.extras[0]?[o.extras[0].l,o.extras[0].v,o.extras[0].s,'']:null}}

const tc=a=>a[3]?'t-'+a[3]:'';
const tile=a=>`<div class="tl"><span class="l">${a[0]}</span><b class="num ${tc(a)}">${a[1]}</b>${a[2]?`<span class="s">${a[2]}</span>`:''}</div>`;

function card(d,i){
const o=calc(d),m=mt(o),open=OPEN.has(i),id='det'+i;
return `<div class="cc" style="--ac:${d.m==='CALL'?'var(--call)':'var(--put)'}">
<div class="chd"><span class="coin" style="color:${CC[d.coin]}">${d.coin}</span><span class="mode">${d.m}</span><span class="grow"></span><span class="vp k-${o.v}">${EMJ[o.v]} ${o.vt}</span></div>
<button class="sum" data-tg="${i}" aria-expanded="${open}" aria-controls="${id}"><div><span class="l">${m.edge[0]}</span><b class="big num">${m.edge[1]}</b><span class="s">Faixa ${m.rng}</span></div><div class="sr"><div><span class="l">${m.dif[0]}</span><b class="num ${tc(m.dif)}">${m.dif[1]}</b></div><div><span class="l">${m.rat[0]}</span><b class="num ${tc(m.rat)}">${m.rat[1]}</b></div></div><span class="s" aria-hidden="true">${open?'▲':'▼'}</span></button>
<div class="tg" id="${id}" ${open?'':'hidden'}>${[m.cot,m.pm,m.dif,m.rat,m.sup,m.res,m.tr,m.ex].filter(Boolean).map(tile).join('')}</div></div>`}

function render(){
document.documentElement.style.setProperty('--w',W+'px');
$('#wd').innerHTML=[[320,'Celular 320'],[380,'Card 380'],[460,'Maior 460']].map(a=>`<button data-w="${a[0]}" aria-pressed="${a[0]===W}">${a[1]}</button>`).join('');
$('#all').textContent=OPEN.size===LIST.length?'Recolher todas':'Expandir todas';
const V={ok:0,warn:0,bad:0};LIST.forEach(d=>V[calc(d).v]++);
$('#strip').innerHTML=`<b>${V.ok}</b> favorável · <b>${V.warn}</b> atenção · <b>${V.bad}</b> desfavorável`;
$('#out').innerHTML=LIST.map(card).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.w)W=+b.dataset.w;
else if(b.dataset.tg!==undefined){const k=+b.dataset.tg;OPEN.has(k)?OPEN.delete(k):OPEN.add(k)}
else if(b.id==='all'){if(OPEN.size===LIST.length)OPEN.clear();else LIST.forEach((_,i)=>OPEN.add(i))}
else return;
render()});
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Strike vs Cotação</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', sans-serif;
  background: #0a0e1a;
  color: #e2e8f0;
  min-height: 100vh;
  padding: 24px;
}

h1 {
  text-align: center;
  font-size: 22px;
  color: #60a5fa;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.subtitle {
  text-align: center;
  color: #475569;
  font-size: 13px;
  margin-bottom: 28px;
  letter-spacing: 1px;
}

/* ── CONTROLES ─────────────────────────────── */
.controls {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 32px;
}

.ctrl-card {
  background: #111827;
  border: 1px solid #1e2d45;
  border-radius: 14px;
  padding: 18px 28px;
  min-width: 220px;
  text-align: center;
}

.ctrl-card label {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #64748b;
  display: block;
  margin-bottom: 10px;
}

.ctrl-card .big-val {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 10px;
}

.ctrl-card input[type="range"] {
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

#sRange { background: linear-gradient(to right, #1d4ed8, #3b82f6); accent-color: #3b82f6; }
#qRange { background: linear-gradient(to right, #15803d, #22c55e); accent-color: #22c55e; }

.ctrl-card input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 3px solid #0a0e1a;
  cursor: pointer;
}

#sRange::-webkit-slider-thumb { background: #3b82f6; }
#qRange::-webkit-slider-thumb { background: #22c55e; }

/* ── GRID ──────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
  gap: 24px;
  max-width: 1300px;
  margin: 0 auto;
}

.card {
  background: #111827;
  border: 1px solid #1e2d45;
  border-radius: 18px;
  padding: 28px 24px 22px;
  position: relative;
  overflow: hidden;
  transition: border-color .3s, transform .3s;
}

.card:hover {
  border-color: #3b82f6;
  transform: translateY(-3px);
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, #1d4ed8, #22c55e);
}

.card-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #475569;
  margin-bottom: 4px;
}

.card-name {
  font-size: 17px;
  font-weight: 700;
  color: #e2e8f0;
  margin-bottom: 20px;
}

.viz {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ── STATUS PILL ────────────────────────────── */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  margin-top: 18px;
}

.pill-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
}

.pill.itm  { background: rgba(22,163,74,.15); color: #4ade80; border: 1px solid #166534; }
.pill.otm  { background: rgba(220,38,38,.15); color: #f87171; border: 1px solid #7f1d1d; }
.pill.atm  { background: rgba(234,179,8,.15);  color: #facc15; border: 1px solid #713f12; }

.pill.itm .pill-dot  { background: #4ade80; }
.pill.otm .pill-dot  { background: #f87171; }
.pill.atm .pill-dot  { background: #facc15; }

.diff-row {
  display: flex;
  justify-content: space-between;
  margin-top: 12px;
  font-size: 12px;
  color: #64748b;
}

.diff-row span { color: #94a3b8; font-weight: 600; }
</style>
</head>
<body>

<h1>Strike vs Cotação Atual</h1>
<p class="subtitle">Análise Comparativa de Opções</p>

<!-- CONTROLES -->
<div class="controls">
  <div class="ctrl-card">
    <label>⬡ Strike</label>
    <div class="big-val" style="color:#3b82f6">R$ <span id="sVal">120</span></div>
    <input type="range" id="sRange" min="50" max="200" value="120" step="0.5">
  </div>
  <div class="ctrl-card">
    <label>◈ Cotação Atual</label>
    <div class="big-val" style="color:#22c55e">R$ <span id="qVal">138</span></div>
    <input type="range" id="qRange" min="50" max="200" value="138" step="0.5">
  </div>
</div>

<!-- GRID DE CARDS -->
<div class="grid">

  <div class="card">
    <div class="card-title">Opção 01</div>
    <div class="card-name">Gauge Semicircular</div>
    <div class="viz"><svg id="g1" viewBox="0 0 360 210" width="360" height="210"></svg></div>
    <div id="p1"></div>
    <div class="diff-row" id="d1"></div>
  </div>

  <div class="card">
    <div class="card-title">Opção 02</div>
    <div class="card-name">Termômetro Duplo</div>
    <div class="viz"><svg id="g2" viewBox="0 0 360 230" width="360" height="230"></svg></div>
    <div id="p2"></div>
    <div class="diff-row" id="d2"></div>
  </div>

  <div class="card">
    <div class="card-title">Opção 03</div>
    <div class="card-name">Bússola Direcional</div>
    <div class="viz"><svg id="g3" viewBox="0 0 300 300" width="300" height="300"></svg></div>
    <div id="p3"></div>
    <div class="diff-row" id="d3"></div>
  </div>

  <div class="card">
    <div class="card-title">Opção 04</div>
    <div class="card-name">Bullet Chart Pro</div>
    <div class="viz"><svg id="g4" viewBox="0 0 380 200" width="380" height="200"></svg></div>
    <div id="p4"></div>
    <div class="diff-row" id="d4"></div>
  </div>

  <div class="card">
    <div class="card-title">Opção 05</div>
    <div class="card-name">Radar de Distância</div>
    <div class="viz"><svg id="g5" viewBox="0 0 300 300" width="300" height="300"></svg></div>
    <div id="p5"></div>
    <div class="diff-row" id="d5"></div>
  </div>

  <div class="card">
    <div class="card-title">Opção 06</div>
    <div class="card-name">Dual Gauge Arco</div>
    <div class="viz"><svg id="g6" viewBox="0 0 360 220" width="360" height="220"></svg></div>
    <div id="p6"></div>
    <div class="diff-row" id="d6"></div>
  </div>

</div>

<script>
// ── HELPERS ─────────────────────────────────────
const $ = id => document.getElementById(id);

function pc(cx, cy, r, deg) {
  const rad = (deg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function arc(cx, cy, r, a1, a2) {
  const p1 = pc(cx, cy, r, a1);
  const p2 = pc(cx, cy, r, a2);
  const large = (a2 - a1 + 360) % 360 > 180 ? 1 : 0;
  return `M ${p1.x} ${p1.y} A ${r} ${r} 0 ${large} 1 ${p2.x} ${p2.y}`;
}

function status(s, q) {
  const diff = q - s;
  const pct  = (diff / s * 100).toFixed(2);
  if (Math.abs(pct) < 1) return { cls: 'atm', label: 'ATM — Na Mocha', pct };
  if (diff > 0)           return { cls: 'itm', label: 'ITM — Dentro do Dinheiro', pct };
  return                         { cls: 'otm', label: 'OTM — Fora do Dinheiro', pct };
}

function setPill(id, s, q) {
  const st = status(s, q);
  const sign = st.pct > 0 ? '+' : '';
  $(id).innerHTML = `<div class="pill ${st.cls}">
    <div class="pill-dot"></div>${st.label} &nbsp;<strong>${sign}${st.pct}%</strong>
  </div>`;
}

function setDiff(id, s, q) {
  const diff = (q - s).toFixed(2);
  const sign = diff > 0 ? '+' : '';
  $(id).innerHTML = `<span>Strike: <span>R$ ${s.toFixed(2)}</span></span>
                     <span>Cotação: <span>R$ ${q.toFixed(2)}</span></span>
                     <span>Diferença: <span>${sign}${diff}</span></span>`;
}

// ── GAUGE 1: Semicircular ────────────────────────
function g1(s, q) {
  const svg = $('g1');
  const cx = 180, cy = 175, ro = 140, ri = 100;
  const MIN = 50, MAX = 200;
  const clamp = v => Math.max(0, Math.min(1, (v - MIN) / (MAX - MIN)));
  const ang = v => -180 + clamp(v) * 180; // -180 a 0

  // faixas
  const zones = [
    { from: -180, to: -120, color: '#7f1d1d' },
    { from: -120, to: -60,  color: '#713f12' },
    { from: -60,  to:  0,   color: '#14532d' },
  ];

  let h = `<defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;

  zones.forEach(z => {
    const p1 = pc(cx, cy, ro, z.from + 90);
    const p2 = pc(cx, cy, ro, z.to + 90);
    const p3 = pc(cx, cy, ri, z.to + 90);
    const p4 = pc(cx, cy, ri, z.from + 90);
    const la = (z.to - z.from) > 180 ? 1 : 0;
    h += `<path d="M${p1.x} ${p1.y} A${ro} ${ro} 0 ${la} 1 ${p2.x} ${p2.y} L${p3.x} ${p3.y} A${ri} ${ri} 0 ${la} 0 ${p4.x} ${p4.y}Z" fill="${z.color}" opacity=".5"/>`;
  });

  // arco externo base
  h += `<path d="${arc(cx,cy,ro,-180+90,0+90)}" fill="none" stroke="#1e293b" stroke-width="2"/>`;

  // ticks
  for (let i = 0; i <= 10; i++) {
    const a = -180 + i * 18;
    const p1 = pc(cx, cy, ro + 6, a + 90);
    const p2 = pc(cx, cy, ro + 14, a + 90);
    const pt = pc(cx, cy, ro + 26, a + 90);
    const val = MIN + (MAX - MIN) / 10 * i;
    h += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#334155" stroke-width="${i % 5 === 0 ? 2 : 1}"/>`;
    if (i % 5 === 0) h += `<text x="${pt.x}" y="${pt.y}" fill="#475569" font-size="11" text-anchor="middle" dominant-baseline="middle">${val}</text>`;
  }

  // arco do strike (azul)
  const sa = ang(s);
  h += `<path d="${arc(cx,cy,(ro+ri)/2,-180+90,sa+90)}" fill="none" stroke="#1d4ed8" stroke-width="18" stroke-linecap="butt" opacity=".3"/>`;

  // arco da cotação (verde)
  const qa = ang(q);
  h += `<path d="${arc(cx,cy,(ro+ri)/2,-180+90,qa+90)}" fill="none" stroke="#15803d" stroke-width="10" stroke-linecap="butt" opacity=".5"/>`;

  // agulha da cotação
  const tip = pc(cx, cy, ri - 8, qa + 90);
  const base1 = pc(cx, cy, 18, qa + 90 + 90);
  const base2 = pc(cx, cy, 18, qa + 90 - 90);
  h += `<polygon points="${tip.x},${tip.y} ${base1.x},${base1.y} ${base2.x},${base2.y}" fill="#22c55e" filter="url(#glow)"/>`;

  // marcador strike (losango)
  const sm = pc(cx, cy, ro - 4, sa + 90);
  h += `<circle cx="${sm.x}" cy="${sm.y}" r="7" fill="#3b82f6" stroke="#0a0e1a" stroke-width="2" filter="url(#glow)"/>`;

  // hub
  h += `<circle cx="${cx}" cy="${cy}" r="22" fill="#111827" stroke="#1e293b" stroke-width="2"/>`;
  h += `<circle cx="${cx}" cy="${cy}" r="6" fill="#60a5fa"/>`;

  // labels
  h += `<text x="${cx}" y="${cy + 28}" fill="#3b82f6" font-size="12" text-anchor="middle" font-weight="600">Strike: ${s.toFixed(2)}</text>`;
  h += `<text x="${cx}" y="${cy + 44}" fill="#22c55e" font-size="12" text-anchor="middle" font-weight="600">Cotação: ${q.toFixed(2)}</text>`;

  svg.innerHTML = h;
  setPill('p1', s, q);
  setDiff('d1', s, q);
}

// ── GAUGE 2: Termômetro Duplo ────────────────────
function g2(s, q) {
  const svg = $('g2');
  const MIN = 50, MAX = 200;
  const clamp = v => Math.max(0, Math.min(1, (v - MIN) / (MAX - MIN)));
  const totalH = 160, barW = 36, y0 = 20;
  const sx = 110, qx = 220;

  const sh = clamp(s) * totalH;
  const qh = clamp(q) * totalH;

  const sy0 = y0 + totalH - sh;
  const qy0 = y0 + totalH - qh;

  let h = `<defs>
    <linearGradient id="tg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="tg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>`;

  // grade horizontal
  for (let i = 0; i <= 10; i++) {
    const gy = y0 + totalH - (i / 10) * totalH;
    const val = MIN + (MAX - MIN) / 10 * i;
    h += `<line x1="50" y1="${gy}" x2="310" y2="${gy}" stroke="#1e293b" stroke-width="1"/>`;
    h += `<text x="42" y="${gy + 4}" fill="#334155" font-size="10" text-anchor="end">${val}</text>`;
    h += `<text x="318" y="${gy + 4}" fill="#334155" font-size="10">${val}</text>`;
  }

  // barra strike (bg)
  h += `<rect x="${sx - barW/2}" y="${y0}" width="${barW}" height="${totalH}" fill="#111827" rx="6" stroke="#1e293b" stroke-width="1"/>`;
  // barra strike (fill)
  h += `<rect x="${sx - barW/2}" y="${sy0}" width="${barW}" height="${sh}" fill="url(#tg1)" rx="4"/>`;
  // bolbo strike
  h += `<circle cx="${sx}" cy="${y0 + totalH + 18}" r="20" fill="#1d4ed8"/>`;
  h += `<text x="${sx}" y="${y0 + totalH + 23}" fill="white" font-size="10" text-anchor="middle" font-weight="700">S</text>`;
  h += `<text x="${sx}" y="${y0 + totalH + 50}" fill="#3b82f6" font-size="12" text-anchor="middle" font-weight="700">${s.toFixed(2)}</text>`;
  h += `<text x="${sx}" y="${y0 + totalH + 65}" fill="#475569" font-size="10" text-anchor="middle">Strike</text>`;

  // label topo strike
  h += `<text x="${sx}" y="${sy0 - 8}" fill="#3b82f6" font-size="12" text-anchor="middle" font-weight="700">${s.toFixed(2)}</text>`;

  // barra cotação (bg)
  h += `<rect x="${qx - barW/2}" y="${y0}" width="${barW}" height="${totalH}" fill="#111827" rx="6" stroke="#1e293b" stroke-width="1"/>`;
  // barra cotação (fill)
  h += `<rect x="${qx - barW/2}" y="${qy0}" width="${barW}" height="${qh}" fill="url(#tg2)" rx="4"/>`;
  // bolbo cotação
  h += `<circle cx="${qx}" cy="${y0 + totalH + 18}" r="20" fill="#15803d"/>`;
  h += `<text x="${qx}" y="${y0 + totalH + 23}" fill="white" font-size="10" text-anchor="middle" font-weight="700">Q</text>`;
  h += `<text x="${qx}" y="${y0 + totalH + 50}" fill="#22c55e" font-size="12" text-anchor="middle" font-weight="700">${q.toFixed(2)}</text>`;
  h += `<text x="${qx}" y="${y0 + totalH + 65}" fill="#475569" font-size="10" text-anchor="middle">Cotação</text>`;

  // label topo cotação
  h += `<text x="${qx}" y="${qy0 - 8}" fill="#22c55e" font-size="12" text-anchor="middle" font-weight="700">${q.toFixed(2)}</text>`;

  // seta de diferença entre os dois
  const midX = (sx + qx) / 2;
  const arrowY = Math.min(sy0, qy0) - 30;
  const diff = q - s;
  const sign = diff > 0 ? '▲' : diff < 0 ? '▼' : '=';
  const col = diff > 0 ? '#22c55e' : diff < 0 ? '#f87171' : '#facc15';
  h += `<text x="${midX}" y="${arrowY}" fill="${col}" font-size="20" text-anchor="middle">${sign}</text>`;
  h += `<text x="${midX}" y="${arrowY + 18}" fill="${col}" font-size="12" text-anchor="middle" font-weight="700">${diff > 0 ? '+' : ''}${diff.toFixed(2)}</text>`;

  svg.innerHTML = h;
  setPill('p2', s, q);
  setDiff('d2', s, q);
}

// ── GAUGE 3: Bússola ─────────────────────────────
function g3(s, q) {
  const svg = $('g3');
  const cx = 150, cy = 150, R = 118;
  const diff = q - s;
  const maxDiff = 80;
  const ratio = Math.min(1, Math.abs(diff) / maxDiff);
  const dir = diff >= 0 ? 90 : 270; // ITM = Leste, OTM = Oeste
  const col = diff > 0 ? '#22c55e' : diff < 0 ? '#f87171' : '#facc15';

  let h = `<defs>
    <radialGradient id="rbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow3"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;

  // corpo da bússola
  h += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#rbg)" stroke="#1e3a5f" stroke-width="3"/>`;
  h += `<circle cx="${cx}" cy="${cy}" r="${R - 8}" fill="none" stroke="#0f172a" stroke-width="2"/>`;

  // graus
  for (let i = 0; i < 36; i++) {
    const a = i * 10;
    const big = i % 9 === 0;
    const p1 = pc(cx, cy, R - 10, a);
    const p2 = pc(cx, cy, R - (big ? 22 : 16), a);
    h += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${big ? '#334155' : '#1e293b'}" stroke-width="${big ? 2 : 1}"/>`;
  }

  // labels cardeais
  const cards = [
    { a: 0,   t: 'N',   c: '#e2e8f0' },
    { a: 90,  t: 'ITM', c: '#22c55e' },
    { a: 180, t: 'S',   c: '#e2e8f0' },
    { a: 270, t: 'OTM', c: '#f87171' },
  ];
  cards.forEach(cd => {
    const p = pc(cx, cy, R - 32, cd.a);
    h += `<text x="${p.x}" y="${p.y}" fill="${cd.c}" font-size="${cd.t.length > 1 ? 10 : 14}" font-weight="700" text-anchor="middle" dominant-baseline="middle">${cd.t}</text>`;
  });

  // círculos internos
  [60, 30].forEach(r => {
    h += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,4"/>`;
  });

  // linhas cruzadas
  h += `<line x1="${cx - R + 14}" y1="${cy}" x2="${cx + R - 14}" y2="${cy}" stroke="#1e293b" stroke-width="1"/>`;
  h += `<line x1="${cx}" y1="${cy - R + 14}" x2="${cx}" y2="${cy + R - 14}" stroke="#1e293b" stroke-width="1"/>`;

  // agulha Norte
  const np = pc(cx, cy, 80, 0);
  h += `<polygon points="${np.x},${np.y} ${cx-8},${cy} ${cx+8},${cy}" fill="#334155"/>`;

  // agulha da cotação
  const nt = pc(cx, cy, ratio * 80, dir);
  const nb1 = pc(cx, cy, 12, dir + 90);
  const nb2 = pc(cx, cy, 12, dir - 90);
  h += `<polygon points="${nt.x},${nt.y} ${nb1.x},${nb1.y} ${nb2.x},${nb2.y}" fill="${col}" filter="url(#glow3)"/>`;

  // hub
  h += `<circle cx="${cx}" cy="${cy}" r="22" fill="#111827" stroke="${col}" stroke-width="2"/>`;
  h += `<text x="${cx}" y="${cy + 4}" fill="${col}" font-size="9" font-weight="700" text-anchor="middle" dominant-baseline="middle">${Math.abs(diff).toFixed(1)}</text>`;

  svg.innerHTML = h;
  setPill('p3', s, q);
  setDiff('d3', s, q);
}

// ── GAUGE 4: Bullet Chart Pro ────────────────────
function g4(s, q) {
  const svg = $('g4');
  const MIN = 50, MAX = 200;
  const clamp = v => Math.max(0, Math.min(1, (v - MIN) / (MAX - MIN)));

  const x0 = 60, y0 = 60, W = 260, H = 52;

  let h = '';

  // zonas
  const zoneColors = ['#1c1917','#292524','#3d3d3d'];
  const zoneW = W / 3;
  zoneColors.forEach((c, i) => {
    h += `<rect x="${x0 + i * zoneW}" y="${y0}" width="${zoneW}" height="${H}" fill="${c}" rx="${i === 0 ? 8 : i === 2 ? '0 8 8 0' : 0}"/>`;
  });
  h += `<rect x="${x0}" y="${y0}" width="${W}" height="${H}" fill="none" stroke="#1e293b" stroke-width="1" rx="8"/>`;

  // zona labels
  ['OTM', 'ATM', 'ITM'].forEach((lbl, i) => {
    const lx = x0 + i * zoneW + zoneW / 2;
    const cols = ['#f87171','#facc15','#4ade80'];
    h += `<text x="${lx}" y="${y0 - 8}" fill="${cols[i]}" font-size="10" text-anchor="middle" font-weight="600">${lbl}</text>`;
  });

  // barra cotação
  const qw = clamp(q) * W;
  const qcol = q < s ? '#f87171' : q > s ? '#4ade80' : '#facc15';
  h += `<rect x="${x0}" y="${y0 + 14}" width="${qw}" height="${H - 28}" fill="${qcol}" rx="4" opacity=".7"/>`;

  // linha strike
  const sx = x0 + clamp(s) * W;
  h += `<rect x="${sx - 3}" y="${y0 - 10}" width="6" height="${H + 20}" fill="#3b82f6" rx="3"/>`;

  // tooltip strike
  h += `<text x="${sx}" y="${y0 - 18}" fill="#3b82f6" font-size="11" text-anchor="middle" font-weight="700">▼ ${s.toFixed(2)}</text>`;

  // tooltip cotação
  const qx = x0 + clamp(q) * W;
  h += `<text x="${qx}" y="${y0 + H + 22}" fill="${qcol}" font-size="11" text-anchor="middle" font-weight="700">▲ ${q.toFixed(2)}</text>`;

  // escala
  for (let i = 0; i <= 6; i++) {
    const x = x0 + (W / 6) * i;
    const val = MIN + (MAX - MIN) / 6 * i;
    h += `<text x="${x}" y="${y0 + H + 42}" fill="#334155" font-size="10" text-anchor="middle">${val.toFixed(0)}</text>`;
  }

  // legenda
  h += `<rect x="${x0}" y="${y0 + H + 60}" width="12" height="12" fill="#3b82f6" rx="2"/>`;
  h += `<text x="${x0 + 16}" y="${y0 + H + 71}" fill="#94a3b8" font-size="11">Strike</text>`;
  h += `<rect x="${x0 + 80}" y="${y0 + H + 60}" width="12" height="12" fill="${qcol}" rx="2"/>`;
  h += `<text x="${x0 + 96}" y="${y0 + H + 71}" fill="#94a3b8" font-size="11">Cotação</text>`;

  // diferença
  const diff = q - s;
  const sign = diff > 0 ? '+' : '';
  h += `<text x="${x0 + W}" y="${y0 + H + 71}" fill="#64748b" font-size="11" text-anchor="end">Δ ${sign}${diff.toFixed(2)}</text>`;

  svg.innerHTML = h;
  setPill('p4', s, q);
  setDiff('d4', s, q);
}

// ── GAUGE 5: Radar de Distância ──────────────────
function g5(s, q) {
  const svg = $('g5');
  const cx = 150, cy = 150, R = 110;
  const MIN = 50, MAX = 200;
  const clamp = v => Math.max(0, Math.min(1, (v - MIN) / (MAX - MIN)));

  const sAngle = clamp(s) * 360;
  const qAngle = clamp(q) * 360;

  let h = `<defs>
    <radialGradient id="radbg">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <filter id="glow5"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;

  h += `<circle cx="${cx}" cy="${cy}" r="${R + 15}" fill="url(#radbg)" stroke="#1e293b" stroke-width="2"/>`;

  // anéis
  [R, R*0.66, R*0.33].forEach(r => {
    h += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,4"/>`;
  });

  // spokes
  for (let i = 0; i < 12; i++) {
    const p = pc(cx, cy, R, i * 30);
    h += `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="#1e293b" stroke-width="1"/>`;
  }

  // ticks externos
  for (let i = 0; i < 36; i++) {
    const p1 = pc(cx, cy, R + 4, i * 10);
    const p2 = pc(cx, cy, R + 10, i * 10);
    h += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#1e3a5f" stroke-width="1"/>`;
  }

  // setor entre strike e cotação
  const p1 = pc(cx, cy, R * clamp(s), sAngle);
  const p2 = pc(cx, cy, R * clamp(q), qAngle);
  const diff = (qAngle - sAngle + 360) % 360;
  const largeArc = diff > 180 ? 1 : 0;
  const qcol = q > s ? '#22c55e' : q < s ? '#f87171' : '#facc15';
  h += `<path d="M ${cx} ${cy} L ${p1.x} ${p1.y} A ${R*clamp(q)} ${R*clamp(q)} 0 ${largeArc} 1 ${p2.x} ${p2.y} Z" fill="${qcol}" opacity=".1"/>`;

  // ponto strike
  const sp = pc(cx, cy, R * clamp(s), sAngle);
  h += `<circle cx="${sp.x}" cy="${sp.y}" r="10" fill="#1d4ed8" stroke="#3b82f6" stroke-width="2" filter="url(#glow5)"/>`;
  h += `<text x="${sp.x}" y="${sp.y + 4}" fill="white" font-size="9" text-anchor="middle" font-weight="700">S</text>`;

  // ponto cotação
  const qp = pc(cx, cy, R * clamp(q), qAngle);
  h += `<circle cx="${qp.x}" cy="${qp.y}" r="10" fill="#15803d" stroke="#22c55e" stroke-width="2" filter="url(#glow5)"/>`;
  h += `<text x="${qp.x}" y="${qp.y + 4}" fill="white" font-size="9" text-anchor="middle" font-weight="700">Q</text>`;

  // linha entre os dois
  h += `<line x1="${sp.x}" y1="${sp.y}" x2="${qp.x}" y2="${qp.y}" stroke="${qcol}" stroke-width="2" stroke-dasharray="4,3" opacity=".6"/>`;

  // centro
  h += `<circle cx="${cx}" cy="${cy}" r="28" fill="#111827" stroke="#1e293b" stroke-width="2"/>`;
  h += `<text x="${cx}" y="${cy - 4}" fill="#64748b" font-size="9" text-anchor="middle">DISTÂNCIA</text>`;
  const dif = Math.abs(q - s).toFixed(2);
  h += `<text x="${cx}" y="${cy + 10}" fill="${qcol}" font-size="13" font-weight="700" text-anchor="middle">${dif}</text>`;

  svg.innerHTML = h;
  setPill('p5', s, q);
  setDiff('d5', s, q);
}

// ── GAUGE 6: Dual Gauge Arco ─────────────────────
function g6(s, q) {
  const svg = $('g6');
  const cx = 180, cy = 185;
  const MIN = 50, MAX = 200;
  const clamp = v => Math.max(0, Math.min(1, (v - MIN) / (MAX - MIN)));
  const toAng = v => -180 + clamp(v) * 180;

  const sAng = toAng(s);
  const qAng = toAng(q);

  const qcol = q > s ? '#22c55e' : q < s ? '#f87171' : '#facc15';

  let h = `<defs>
    <filter id="glow6"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;

  // arcos de fundo
  [145, 115, 85].forEach((r, i) => {
    const cols = ['#0f172a','#111827','#1e293b'];
    h += `<path d="${arc(cx,cy,r,-180+90,0+90)}" fill="none" stroke="${cols[i]}" stroke-width="20"/>`;
  });

  // arco strike (azul) — externo
  h += `<path d="${arc(cx,cy,145,-180+90,sAng+90)}" fill="none" stroke="#1d4ed8" stroke-width="18" stroke-linecap="round"/>`;

  // arco cotação (colorido) — médio
  h += `<path d="${arc(cx,cy,115,-180+90,qAng+90)}" fill="none" stroke="${qcol}" stroke-width="18" stroke-linecap="round" filter="url(#glow6)" opacity=".85"/>`;

  // marcas
  for (let i = 0; i <= 10; i++) {
    const a = -180 + i * 18;
    const p1 = pc(cx, cy, 168, a + 90);
    const p2 = pc(cx, cy, 158, a + 90);
    h += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#334155" stroke-width="${i % 5 === 0 ? 2 : 1}"/>`;
    if (i % 5 === 0) {
      const pt = pc(cx, cy, 175, a + 90);
      const val = MIN + (MAX - MIN) / 10 * i;
      h += `<text x="${pt.x}" y="${pt.y}" fill="#334155" font-size="10" text-anchor="middle" dominant-baseline="middle">${val}</text>`;
    }
  }

  // ponta da agulha do strike
  const sT = pc(cx, cy, 130, sAng + 90);
  h += `<circle cx="${sT.x}" cy="${sT.y}" r="8" fill="#3b82f6" stroke="#0a0e1a" stroke-width="2"/>`;

  // ponta da agulha da cotação
  const qT = pc(cx, cy, 100, qAng + 90);
  h += `<circle cx="${qT.x}" cy="${qT.y}" r="8" fill="${qcol}" stroke="#0a0e1a" stroke-width="2" filter="url(#glow6)"/>`;

  // hub
  h += `<circle cx="${cx}" cy="${cy}" r="38" fill="#111827" stroke="#1e293b" stroke-width="2"/>`;
  h += `<text x="${cx}" y="${cy - 10}" fill="#64748b" font-size="9" text-anchor="middle" letter-spacing="1">SPREAD</text>`;
  const diff = (q - s).toFixed(2);
  const sign = diff > 0 ? '+' : '';
  h += `<text x="${cx}" y="${cy + 10}" fill="${qcol}" font-size="16" font-weight="700" text-anchor="middle">${sign}${diff}</text>`;

  // legendas abaixo
  h += `<text x="${cx - 80}" y="${cy + 55}" fill="#3b82f6" font-size="12" text-anchor="middle" font-weight="600">Strike</text>`;
  h += `<text x="${cx - 80}" y="${cy + 70}" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="700">${s.toFixed(2)}</text>`;

  h += `<text x="${cx + 80}" y="${cy + 55}" fill="${qcol}" font-size="12" text-anchor="middle" font-weight="600">Cotação</text>`;
  h += `<text x="${cx + 80}" y="${cy + 70}" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="700">${q.toFixed(2)}</text>`;

  svg.innerHTML = h;
  setPill('p6', s, q);
  setDiff('d6', s, q);
}

// ── RENDER ───────────────────────────────────────
function render() {
  const s = parseFloat($('sRange').value);
  const q = parseFloat($('qRange').value);
  $('sVal').textContent = s.toFixed(2);
  $('qVal').textContent = q.toFixed(2);
  g1(s, q); g2(s, q); g3(s, q);
  g4(s, q); g5(s, q); g6(s, q);
}

$('sRange').addEventListener('input', render);
$('qRange').addEventListener('input', render);
render();
</script>
</body>
</html>
